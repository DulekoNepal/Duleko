ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // Play Console requires targeting 36 as of publishing this app. Android
    // enforces edge-to-edge (content drawn under the status/gesture-nav
    // bars) for any app targeting 35+, with no opt-out at all once it's 36
    // - but Capacitor's own bridge (SystemBars, bundled in @capacitor/android
    // since 8.x) already handles this correctly out of the box, padding the
    // WebView to the real system-bar insets regardless of target SDK. See
    // MainActivity.java - it deliberately does NOT try to opt out of
    // edge-to-edge itself anymore, since doing so would just fight Capacitor's
    // own handling instead of using it.
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}